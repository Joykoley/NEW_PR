<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Jinstang Fest</h1>
        <a href="pro.html">Home</a> | <a href="Event.html">Events</a> | <a href="Register.html">Register</a>
        <hr>
    </div>
    <div>
        <fieldset
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="event">Select Event:</label>
                <select id="event" name="event" required>
                    <option value="music">Music Concert</option>
                    <option value="art">Art Exhibition</option>
                    <option value="food">Food Festival</option>
                    <option value="dance">Dance Performance</option>
                    <option value="coding">Coding Competition</option>
                    <option value="Web">Web Dev</option>
                </select><br><br>
                <label for="Phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required><br><br>
                <label for="address">Address:</label>
                <textarea name="address" id="address"></textarea><br><br>
                <input type="checkbox" id="check" name="check" required>
                <label for="check">I agree to <strong>T&C</strong></label><br><br>
                

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>
        </fieldset>
    </div>
    <footer>
        <br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    </footer>
</body>
</html>
